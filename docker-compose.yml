services:
  local_chain:
    image: ghcr.io/foundry-rs/foundry@sha256:0c00cb0bda1ab1b91c9a6bf60f4c76c09c1a8870824b6d4718afbabacf6f9a17
    container_name: smart-money-local-chain
    profiles: ["local-test"]
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--chain-id"
      - "31337"
      - "--accounts"
      - "2"
      - "--silent"
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: smart-money-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_money
      MYSQL_USER: smart_money
      MYSQL_PASSWORD: ${SMART_MONEY_MYSQL_PASSWORD:-local-paper-only}
      MYSQL_ROOT_PASSWORD: ${SMART_MONEY_MYSQL_ROOT_PASSWORD:-local-root-only}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - smart_money_mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u smart_money -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  key_mysql:
    image: mysql:8.4
    container_name: smart-money-key-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_money_keys
      MYSQL_USER: smart_money_key_admin
      MYSQL_PASSWORD: ${SMART_MONEY_KEY_MYSQL_ADMIN_PASSWORD:-local-key-admin-only}
      MYSQL_ROOT_PASSWORD: ${SMART_MONEY_KEY_MYSQL_ROOT_PASSWORD:-local-key-root-only}
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - smart_money_key_mysql:/var/lib/mysql
      - ./docker/key-mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u smart_money_key_admin -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  smart_money_mysql:
  smart_money_key_mysql:
